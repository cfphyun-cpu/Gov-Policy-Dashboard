      const activeItems = policyData.filter(d => d.hasUpdate);
      document.getElementById('stat-total').innerText = activeItems.length;
      document.getElementById('stat-ksqa').innerText = activeItems.filter(d => d.ministry === '직업능력심사평가원' || d.category === 'K-DT·AI캠퍼스' || d.category === '인재양성·정책연구').length;
      document.getElementById('stat-ai').innerText = activeItems.filter(d => d.category === 'AI·신기술').length;
      document.getElementById('stat-empty').innerText = policyData.filter(d => !d.hasUpdate).length;
    }

    function renderCards() {
      let filtered = policyData.filter(item => {
        const matchMinistry = currentMinistry === 'all' || item.ministry === currentMinistry;
        const matchCategory = currentCategory === 'all' || item.category === currentCategory;
        const matchSearch = searchQuery === '' || 
          item.title.toLowerCase().includes(searchQuery) ||
          item.summary.some(s => s.toLowerCase().includes(searchQuery)) ||
          item.ministry.toLowerCase().includes(searchQuery);
        return matchMinistry && matchCategory && matchSearch;
      });

      filtered.sort((a, b) => {
        if (a.hasUpdate !== b.hasUpdate) return a.hasUpdate ? -1 : 1;
        return b.actualDate.localeCompare(a.actualDate);
      });

      resultCount.innerText = filtered.length;

      cardGrid.innerHTML = filtered.map(item => {
        if (!item.hasUpdate) {
          return `
            <div class="bg-slate-100/70 rounded-xl border border-dashed border-slate-300 p-4 sm:p-5 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between gap-2 mb-2.5">
                  <span class="text-xs font-semibold px-2 py-0.5 rounded-md border ${ministryColorMap[item.ministry] || 'bg-slate-100 text-slate-600'}">
                    ${item.ministry}
                  </span>
                  <span class="text-xs font-semibold text-slate-400 bg-slate-200/80 px-2 py-0.5 rounded-full">${item.actualDate}</span>
                </div>
                <h3 class="text-sm font-semibold text-slate-600 leading-snug mb-3">
                  ${item.title}
                </h3>
                <ul class="space-y-1.5 mb-4 text-xs text-slate-500">
                  ${item.summary.map(s => `
                    <li class="flex items-start gap-1.5">
                      <span class="text-slate-400">•</span>
                      <span>${s}</span>
                    </li>
                  `).join('')}
                </ul>
              </div>
              <div class="pt-3 border-t border-slate-200/70 flex items-center justify-between text-xs">
                <span class="text-slate-400 font-medium">교차검증 완료</span>
                <a href="${item.boardUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 font-medium text-slate-600 hover:text-slate-900">
                  보도자료 바로가기
                  <i class="ph-bold ph-arrow-up-right"></i>
                </a>
              </div>
            </div>
          `;
        }

        const isKSQA = item.ministry === '직업능력심사평가원';
        const isSpecialOrg = isKSQA || item.ministry === '한국직업능력연구원';

        return `
          <div class="bg-white rounded-xl border ${isSpecialOrg ? 'border-teal-300 ring-1 ring-teal-100 shadow-sm' : 'border-slate-200 shadow-xs'} p-4 sm:p-5 flex flex-col justify-between hover:border-slate-400 transition duration-150">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2.5">
                <span class="text-xs px-2 py-0.5 rounded-md border ${ministryColorMap[item.ministry] || 'bg-slate-50 text-slate-600'}">
                  ${item.ministry}
                </span>
                <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md border border-slate-200" title="실제 공식 공고/배포일자">
                  📅 ${item.actualDate}
                </span>
              </div>
              <h3 class="text-sm font-bold text-slate-900 leading-snug mb-3">
                ${item.title}
              </h3>
              <ul class="space-y-1.5 mb-4 text-xs text-slate-600">
                ${item.summary.map(s => `
                  <li class="flex items-start gap-1.5">
                    <span class="${isSpecialOrg ? 'text-teal-600 font-bold' : 'text-blue-500 font-bold'}">•</span>
                    <span>${s}</span>
                  </li>
                `).join('')}
              </ul>
            </div>
            <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs gap-2 flex-wrap">
              <span class="text-slate-500 font-medium truncate max-w-[140px]" title="${item.support}">
                💰 ${item.support}
              </span>
              <div class="flex items-center gap-2 shrink-0">
                <a href="${item.boardUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 font-semibold ${isSpecialOrg ? 'text-teal-700 hover:text-teal-800' : 'text-blue-600 hover:text-blue-700'}">
                  보도자료 바로가기
                  <i class="ph-bold ph-arrow-up-right"></i>
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.querySelectorAll('.ministry-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.ministry-btn').forEach(b => {
          b.className = 'ministry-btn shrink-0 px-3 py-1.5 rounded-lg border transition bg-white text-slate-600 border-slate-200 hover:bg-slate-50';
        });
        e.target.className = 'ministry-btn active shrink-0 px-3 py-1.5 rounded-lg border transition bg-blue-600 text-white border-blue-600';
        currentMinistry = e.target.getAttribute('data-value');
        renderCards();
      });
    });

    document.querySelectorAll('.category-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.category-btn').forEach(b => {
          b.className = 'category-btn px-2.5 py-1 rounded-full border transition bg-white text-slate-600 border-slate-200 hover:bg-slate-50';
        });
        e.target.className = 'category-btn active px-2.5 py-1 rounded-full border transition bg-slate-900 text-white border-slate-900';
        currentCategory = e.target.getAttribute('data-value');
        renderCards();
      });
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderCards();
    });

    document.getElementById('copySlackBtn').addEventListener('click', () => {
      const activeList = policyData.filter(d => d.hasUpdate);
      const emptyList = policyData.filter(d => !d.hasUpdate).map(d => d.ministry);

      let summaryText = `📢 *[정부지원사업그룹] 주요 부처 및 심평원(공지/보도)·직능연 보도자료 모니터링*\n`;
      summaryText += `🗓️ _기준일시: 2026.09.01 07:00 (3차 교차검증 완료)_\n\n`;
      
      if (activeList.length > 0) {
        summaryText += `━━━━━━━━━━━━━━━━━━━━━━\n`;
        summaryText += `🔥 *신규 보도자료 및 공고 (${activeList.length}건)*\n`;
        summaryText += `━━━━━━━━━━━━━━━━━━━━━━\n\n`;
        
        summaryText += activeList.map((item, idx) => {
          let links = `  🔗 *보도자료/공고:* ${item.boardUrl}`;
          if (item.noticeUrl) links += `\n  🔗 *공지사항:* ${item.noticeUrl}`;
          return `*${idx + 1}. [${item.ministry}] ${item.title}* (${item.actualDate})\n` +
                 item.summary.map(s => `  • ${s}`).join('\n') + `\n` +
                 `  👉 *지원규모:* ${item.support}\n` + links;
        }).join('\n\n') + `\n\n`;
      }

      if (emptyList.length > 0) {
        summaryText += `━━━━━━━━━━━━━━━━━━━━━━\n`;
        summaryText += `ℹ️ *신규 발표 없음 (모니터링 완료)*\n`;
        summaryText += `• ${emptyList.join(', ')}\n`;
        summaryText += `━━━━━━━━━━━━━━━━━━━━━━\n`;
      }

      navigator.clipboard.writeText(summaryText).then(() => {
        showToast('팀 메신저 공유용 요약 텍스트가 복사되었습니다!');
      });
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    updateStats();
    renderCards();
  </script>
</body>
</html>
